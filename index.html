<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone log, sticky day header, fixed bottom tab bar; squares as the recurring motif */
:root{
  --bg:#f1ebe1; --surface:#faf6ef; --surface-2:#e9e1d4; --ink:#2b251f; --muted:#776b5d; --line:#ddd2c2;
  --accent:#5d6e38; --accent-ink:#fbf8f1; --accent-soft:#e1e3c8;
  --warn:#b0731c; --warn-soft:#f2e2c4; --bad:#a3472e; --bad-soft:#f1d9cf;
  --cheat:#a5574f; --rest:#5f7a7c; --rest-soft:#dde5e2;
  --h0:#e6ddcf; --h1:#d4d2a6; --h2:#a9b277; --h3:#7b8c4a; --h4:#4d5f2c;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1814; --surface:#25211c; --surface-2:#2f2a23; --ink:#ede5d8; --muted:#a69a8b; --line:#3b352d;
  --accent:#a8b872; --accent-ink:#1b1814; --accent-soft:#353b24;
  --warn:#dba653; --warn-soft:#3b2f1a; --bad:#db7d62; --bad-soft:#3d241c;
  --cheat:#d4928a; --rest:#9fb3b3; --rest-soft:#263130;
  --h0:#2b2621; --h1:#3c4227; --h2:#58642f; --h3:#7f9146; --h4:#b3c674;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1814; --surface:#25211c; --surface-2:#2f2a23; --ink:#ede5d8; --muted:#a69a8b; --line:#3b352d;
  --accent:#a8b872; --accent-ink:#1b1814; --accent-soft:#353b24;
  --warn:#dba653; --warn-soft:#3b2f1a; --bad:#db7d62; --bad-soft:#3d241c;
  --cheat:#d4928a; --rest:#9fb3b3; --rest-soft:#263130;
  --h0:#2b2621; --h1:#3c4227; --h2:#58642f; --h3:#7f9146; --h4:#b3c674;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i{width:6px;height:6px;border-radius:1.5px;background:var(--h2)}
.logo i:nth-child(2),.logo i:nth-child(6),.logo i:nth-child(7){background:var(--h4)}
.logo i:nth-child(4),.logo i:nth-child(9){background:var(--h1)}
.logo-img{width:22px;height:22px;display:block;flex:none}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;text-align:left;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw{display:flex;gap:2px;flex:none}.sw i{width:11px;height:11px;border-radius:3px}
.who{margin-left:auto;font-size:13px;color:var(--muted)}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:26px;font-weight:800;line-height:1.1}
h2{font-size:17px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h .meta{font-size:13px;color:var(--muted)}

/* day nav */
.daynav{display:flex;align-items:center;gap:8px;padding-top:4px}
.daynav .mid{flex:1;min-width:0;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg.four{grid-template-columns:repeat(4,1fr)}

/* banners */
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1 1 200px;min-width:0}
.banner.ex{background:var(--accent-soft)}
.banner.bk{background:var(--warn-soft)}
.banner.err{background:var(--bad-soft)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* score */
.score{display:flex;align-items:center;gap:14px}
.bigsq{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:15px}
.score .t{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.15}

/* goal rows */
.goals{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.grow:first-child{border-top:0;padding-top:2px}
.gl{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.gv{font-size:13px;color:var(--muted);text-align:right}
.gv b{color:var(--ink);font-weight:600}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.s-hit .bar i{background:var(--accent)}
.s-low .bar i,.s-high .bar i{background:var(--warn)}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.hit{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.rest{background:var(--rest-soft);color:var(--rest)}
.chip.cheat{background:color-mix(in srgb,var(--cheat) 16%,transparent);color:var(--cheat)}
.streak{font-size:11px;font-weight:600;color:var(--accent);font-family:var(--f-num)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .name{flex:1;min-width:0}
.li .name div{overflow-wrap:anywhere}
.li .sub{font-size:12px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tot{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.tot b{font-family:var(--f-num);font-size:18px;font-weight:600;display:block}

/* inputs */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;min-width:0}
.inp.num{font-family:var(--f-num)}
textarea.inp{resize:vertical;min-height:70px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
details summary::-webkit-details-marker{display:none}

/* water */
.water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.water .amt{font-family:var(--f-num);font-size:28px;font-weight:600}
.drops{display:flex;gap:4px;flex-wrap:wrap;flex:1 1 140px}
.drops i{width:14px;height:20px;border-radius:4px;background:var(--surface-2)}
.drops i.on{background:color-mix(in srgb,var(--rest) 70%,var(--accent))}

/* exercises */
.ex{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:6px;align-items:center}
.set .n{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:center}

/* heatmap */
.hm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hm{display:inline-grid;grid-template-columns:22px auto;gap:4px 4px}
.hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:14px;gap:3px;font-size:10px;color:var(--muted);height:14px}
.hm-months span{white-space:nowrap}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:9px;color:var(--muted);line-height:14px}
.hm-grid{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.sq{width:14px;height:14px;border-radius:3px;background:var(--h0);border:0;padding:0;position:relative}
.sq.lv1{background:var(--h1)}.sq.lv2{background:var(--h2)}.sq.lv3{background:var(--h3)}.sq.lv4{background:var(--h4)}
.sq.skip{background:repeating-linear-gradient(135deg,var(--h0) 0 3px,var(--line) 3px 5px)}
.sq.rest{box-shadow:inset 0 0 0 1.5px var(--rest)}
.sq.cheat::after{content:"";position:absolute;right:-1px;top:-1px;width:5px;height:5px;border-radius:50%;background:var(--cheat);border:1px solid var(--surface)}
.sq.today{outline:1.5px solid var(--ink);outline-offset:1px}
.sq.blank{background:transparent}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend .sq{display:inline-block;width:11px;height:11px}
.legend .gapx{width:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.stat .d{font-size:11px;color:var(--muted)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:9px}
.burn{font-family:var(--f-num);font-size:30px;font-weight:600}

.hitbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:72px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.hb .bar{grid-column:auto}
.hb .bar i{background:var(--accent)}
.hb .v{font-family:var(--f-num);text-align:right;color:var(--muted);font-size:12px}

pre.share{white-space:pre-wrap;font-family:var(--f-num);font-size:12px;background:var(--surface-2);border-radius:10px;padding:10px;margin:0;max-height:240px;overflow:auto}

/* goals editor */
.ge{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ge:first-child{border-top:0}
.ge .ins{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ge .ins .inp{width:92px;padding:7px 8px;font-size:15px}
.ge .t{font-weight:600}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sheet-b{overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px}
.food-pick{background:var(--accent-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.stepper .inp{width:70px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}


.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;font-size:12px;min-width:720px;width:100%}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{font-family:var(--f-body);font-weight:600}
.tbl td.ok{color:var(--accent)}
.tbl td.off{color:var(--warn)}
.rep-h{display:flex;flex-direction:column;gap:6px;padding-top:4px}
@media print{
 :root,:root[data-theme="dark"],:root[data-theme="light"]{--bg:#fff;--surface:#fff;--surface-2:#efe8dd;--ink:#2b251f;--muted:#6f6355;--line:#ddd2c2;--accent:#5d6e38;--accent-ink:#fff;--accent-soft:#e1e3c8;--warn:#b0731c;--warn-soft:#f2e2c4;--cheat:#a5574f;--rest:#5f7a7c;--rest-soft:#dde5e2;--h0:#e6ddcf;--h1:#d4d2a6;--h2:#a9b277;--h3:#7b8c4a;--h4:#4d5f2c;color-scheme:light}
 .top,.tabs,.noprint,.toast,#sheet{display:none!important}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{max-width:none;padding:0}
 .card{break-inside:avoid;border-color:#d8e2dc}
 .tbl-wrap{overflow:visible}.tbl{min-width:0;font-size:10px}
 .stats{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sq,.pill,.btn,.seg button{transition:background-color .15s,box-shadow .15s}}
</style>

<script>
(function(){
const KEY='greensquares.v1';
let storageOk=true;
let S=null;
const ui={tab:'today',date:null,calFilter:'all',range:30,period:7,sheet:null,confirm:null,q:'',pick:null,pickQty:1,pickCheat:false,showEx:false,backupText:'',copyText:'',from:null,to:null,askQ:'',askRange:30,askFallback:false,askPrompt:''};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const fmtDay=(k,o)=>parseKey(k).toLocaleDateString(undefined,o||{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const r1=n=>Math.round(n*10)/10;
const fmtN=n=>n==null?'–':Math.round(n).toLocaleString();
const fmt1=n=>n==null?'–':(Math.round(n*10)/10).toLocaleString(undefined,{maximumFractionDigits:1});
const $=s=>document.querySelector(s);

/* ---------- model ---------- */
const GOALS=[
 {k:'calories',label:'Calories',unit:'kcal',type:'range'},
 {k:'protein',label:'Protein',unit:'g',type:'range'},
 {k:'water',label:'Water',unit:'L',type:'range'},
 {k:'steps',label:'Steps',unit:'',type:'min',act:true},
 {k:'cardio',label:'Cardio',unit:'min',type:'min',act:true},
 {k:'lifting',label:'Lifting',unit:'',type:'done',act:true},
 {k:'hiit',label:'HIIT',unit:'min',type:'min',act:true},
 {k:'func',label:'Functional',unit:'min',type:'min',act:true},
 {k:'sleep',label:'Sleep',unit:'h',type:'min'}
];
const LIFTS=['Push','Pull','Legs','Upper','Lower','Full body','Other'];
const CARDIO=['Incline walk','Run','Cycling','Cross trainer','Stair climber','Badminton','Cricket','Football','Rowing','Sports'];
const LISTS={
 cardio:{label:'Cardio',add:'Add cardio',ph:'Activity',sug:CARDIO},
 hiit:{label:'HIIT',add:'Add HIIT',ph:'e.g. Tabata, circuit',sug:['Tabata','EMOM','AMRAP','Circuit','Bootcamp','Spin intervals','Sprint intervals','Burpee ladder']},
 func:{label:'Functional strength',add:'Add functional session',ph:'e.g. Kettlebells',sug:['Kettlebells','Sled push/pull','Farmer\'s carry','TRX','CrossFit WOD','Animal flow','Medicine ball','Sandbag']},
 other:{label:'Other',add:'Add other activity',ph:'e.g. Yoga',sug:['Yoga','Pilates','Mobility','Stretching','Swimming','Hiking','Martial arts','Dance','Climbing','Physio']}
};
const sumMin=a=>a&&a.length?a.reduce((x,c)=>x+(c.min||0),0):null;
function listBlock(d,k){const L=LISTS[k],arr=d[k]||[];return`<div><div class="eyebrow" style="margin-bottom:6px">${L.label}</div>
 <div class="list">${arr.map((c,i)=>`<div class="li" style="gap:8px"><input class="inp" style="flex:1" id="f-${k}t${i}" list="${k}-list" data-field="${k}.${i}.type" value="${esc(c.type)}" placeholder="${esc(L.ph)}"><input class="inp num" style="width:84px" id="f-${k}m${i}" inputmode="numeric" data-field="${k}.${i}.min" value="${c.min??''}" placeholder="min"><button class="x" data-act="dellist" data-k="${k}" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}</div>
 <button class="btn sm" style="margin-top:6px" data-act="addlist" data-k="${k}">${L.add}</button></div>`}
function allTypes(k){const s=new Set();Object.values(S.days).forEach(d=>(d[k]||[]).forEach(c=>c.type&&s.add(c.type)));return[...s]}
function trainingStr(d){return[...(d.hiit||[]).map(c=>['HIIT',c]),...(d.func||[]).map(c=>['Functional',c]),...(d.other||[]).map(c=>['',c])].filter(([,c])=>c.type||c.min).map(([pre,c])=>esc(pre?(c.type?pre+' · '+c.type:pre):c.type)+(c.min?' '+c.min+'m':'')).join(', ')||'–'}

const MEAS=[['waist','Waist'],['chest','Chest'],['hips','Hips'],['armL','Left arm'],['armR','Right arm'],['thighL','Left thigh'],['thighR','Right thigh']];
const MEAS_OLD=[['arm','Arm'],['thigh','Thigh']];
const COMP=[['fat','Body fat'],['muscle','Muscle mass']];
function lastCheckin(dk){const ks=Object.keys(S.days).filter(k=>k<dk&&S.days[k]&&(S.days[k].weight!=null||(S.days[k].meas&&Object.keys(S.days[k].meas).length))).sort();if(!ks.length)return null;const k=ks[ks.length-1];const n=Math.round((parseKey(dk)-parseKey(k))/864e5);return fmtDay(k,{month:'short',day:'numeric'})+` (${n} day${n===1?'':'s'} ago)`}
function measCard(within){
 const rows=[...COMP.map(([k,l])=>[k,l,'%']),...[...MEAS,...MEAS_OLD].map(([k,l])=>[k,l,' '+S.profile.lUnit])];
 const ks=Object.keys(S.days).sort().filter(k=>!within||within.includes(k));
 const out=rows.map(([k,l,u])=>{const has=ks.filter(x=>S.days[x].meas&&S.days[x].meas[k]!=null);if(!has.length)return'';const a=S.days[has[0]].meas[k],b=S.days[has[has.length-1]].meas[k],dd=b-a;return`<div class="spread"><span>${l}</span><span class="num">${has.length>1?`${fmt1(a)} → ${fmt1(b)}${u} (${dd>0?'+':''}${fmt1(dd)})`:`${fmt1(b)}${u}`}</span></div>`}).join('');
 if(!out)return'';
 return`<section class="card${within?' rep':''}"><div class="card-h"><h2>Body composition &amp; measurements</h2><span class="meta">first → latest</span></div><div class="hitbars">${out}</div></section>`;
}


function defaultProfile(){return{name:'',wUnit:'kg',lUnit:'cm',liftMode:'session',font:'default',theme:'earthy',mode:'auto',goals:{
 calories:{on:true,min:2100,max:2300},protein:{on:true,min:120,max:150},water:{on:true,min:2,max:3},
 steps:{on:true,min:15000},cardio:{on:true,min:60},lifting:{on:true,perWeek:5},hiit:{on:false,min:20},func:{on:false,min:30},sleep:{on:true,min:7}}}}
function newState(){return{v:1,profile:defaultProfile(),foods:[],days:{},lastBackup:null,example:false}}

function exampleState(){
 const s=newState();s.example=true;s.profile.name='Example';
 const t=todayKey();
 // weight, kcal, protein, water, steps, lift, liftMin, cardio, cardioMin, sleep, status, cheat, note
 const rows=[
  [88.9,2600,140,3,15000,'Push',60,'Incline walk',30,null],
  [89.2,2560,155,3,20000,'Pull',60,'Incline walk',60,null],
  [89.3,2140,135,2,10000,'Push',60,'Run',30,null,null,false,'5 km run'],
  [89.3,3260,165,2,10000,null,0,'Run',154,6,null,false,'Half marathon, 7:17 pace'],
  [89.9,1925,163,2,10000,null,0,null,0,8,'rest'],
  [90.0,2735,148,3,15000,'Pull',60,'Cross trainer',30,8],
  [90.0,2425,151,3,15000,'Legs',60,'Incline walk',60,8],
  [89.7,2950,110,1,10000,'Push',90,null,0,7.5,null,true,'Beer + peanut masala'],
  [90.03,1895,148,2,10000,'Pull',60,'Badminton',60,7],
  [90.3,2130,80,2,7000,'Legs',60,'Cricket',60,7]];
 rows.forEach((r,i)=>{
  const dk=addDays(t,i-10);
  const food=[{id:uid(),name:'Day total (example)',kcal:r[1]-(r[11]?700:0),protein:r[2]-(r[11]?20:0),qty:1,cheat:false}];
  if(r[11])food.push({id:uid(),name:'Beer + peanut masala',kcal:700,protein:20,qty:1,cheat:true});
  const d={weight:r[0],food,water:r[3],steps:r[4],cardio:r[7]?[{type:r[7],min:r[8]}]:[],sleep:r[9],status:r[10]||'normal',notes:r[12]||''};
  if(r[5])d.lift={type:r[5],min:r[6]};
  s.days[dk]=d;
 });
 s.days[addDays(t,-10)].meas={fat:24.1,muscle:37.2,waist:94};
 s.days[addDays(t,-3)].meas={fat:23.6,muscle:37.6,waist:93};
 s.days[addDays(t,-5)].hiit=[{type:'Tabata',min:20}];
 s.foods=[
  {id:uid(),name:'Eggs',serving:'2 large',kcal:140,protein:12},
  {id:uid(),name:'Whey protein',serving:'1 scoop',kcal:120,protein:24},
  {id:uid(),name:'Paneer',serving:'100 g',kcal:265,protein:18},
  {id:uid(),name:'Roti',serving:'1 medium',kcal:110,protein:3}];
 return s;

const day=k=>S.days[k];
function dayW(k){return S.days[k]||(S.days[k]={status:'normal',food:[],cardio:[]})}
function hasData(d){return !!d&&!!((d.food&&d.food.length)||d.water||d.steps!=null||(d.cardio&&d.cardio.length)||(d.hiit&&d.hiit.length)||(d.func&&d.func.length)||(d.other&&d.other.length)||(d.lift&&d.lift.type)||d.sleep!=null||d.weight!=null||d.notes||(d.status&&d.status!=='normal')||(d.meas&&Object.keys(d.meas).length))}
const isCheat=d=>!!d&&!!d.food&&d.food.some(f=>f.cheat);
const cheatCount=d=>d&&d.food?d.food.filter(f=>f.cheat).length:0;

function val(d,k){
 if(!d)return null;
 switch(k){
  case'calories':return d.food&&d.food.length?d.food.reduce((a,f)=>a+f.kcal*f.qty,0):null;
  case'protein':return d.food&&d.food.length?d.food.reduce((a,f)=>a+f.protein*f.qty,0):null;
  case'water':return d.water?d.water:null;
  case'steps':return d.steps??null;
  case'cardio':return sumMin(d.cardio);
  case'hiit':return sumMin(d.hiit);
  case'func':return sumMin(d.func);
  case'lifting':return d.lift&&d.lift.type?1:null;
  case'sleep':return d.sleep??null;
 }
}
function evalGoal(k,dk){
 const g=S.profile.goals[k];if(!g.on)return'off';
 const d=day(dk),def=GOALS.find(x=>x.k===k);
 if(d&&d.status==='skip')return'na';
 if(def.act&&d&&d.status==='rest')return'na';
 const v=val(d,k);
 if(v==null)return hasData(d)?'miss':'empty';
 if(def.type==='range'){if(v<g.min)return'low';if(v>g.max)return'high';return'hit'}
 if(def.type==='min')return v>=g.min?'hit':'low';
 return'hit';
}
function dayScore(dk,only){
 const d=day(dk);
 if(!hasData(d))return{level:0,hits:0,total:0,empty:true};
 if(d.status==='skip')return{skip:true,level:0,hits:0,total:0};
 let hits=0,total=0;
 for(const g of GOALS){if(only&&only!=='all'&&g.k!==only)continue;const s=evalGoal(g.k,dk);if(s==='off'||s==='na')continue;total++;if(s==='hit')hits++}
 if(!total)return{level:0,hits,total,rest:d.status==='rest',none:true};
 const r=hits/total;
 return{hits,total,rest:d.status==='rest',level:r>=1?4:r>=.7?3:r>=.4?2:1};
}
function firstDate(){const ks=Object.keys(S.days).filter(k=>hasData(S.days[k])).sort();return ks[0]||todayKey()}
function streak(k){
 if(!S.profile.goals[k].on)return 0;
 let dk=todayKey(),c=0;
 if(evalGoal(k,dk)!=='hit')dk=addDays(dk,-1);
 const first=firstDate();
 for(let i=0;i<3000&&dk>=first;i++){const s=evalGoal(k,dk);if(s==='hit')c++;else if(s!=='na')break;dk=addDays(dk,-1)}
 return c;
}
function logStreak(){
 let dk=todayKey(),c=0;if(!hasData(day(dk)))dk=addDays(dk,-1);
 const first=firstDate();
 for(let i=0;i<3000&&dk>=first;i++){if(hasData(day(dk)))c++;else break;dk=addDays(dk,-1)}
 return c;
}
function weekStart(dk){const d=parseKey(dk);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return keyOf(d)}
function liftsInWeek(dk){const s=weekStart(dk);let c=0;for(let i=0;i<7;i++){const d=day(addDays(s,i));if(d&&d.lift&&d.lift.type)c++}return c}

}

/* calendar */
function viewCalendar(){
 const t=todayKey(),weeks=26;
 const start=parseKey(t);start.setDate(start.getDate()-start.getDay()-(weeks-1)*7);
 let months='',cells='',lastM=-1;
 for(let w=0;w<weeks;w++){
  const wd=new Date(start);wd.setDate(start.getDate()+w*7);
  const m=wd.getMonth();
  months+=`<span>${m!==lastM&&wd.getDate()<=7||w===0&&m!==lastM?wd.toLocaleDateString(undefined,{month:'short'}):''}</span>`;
  if(m!==lastM)lastM=m;
  for(let r=0;r<7;r++){
   const cd=new Date(start);cd.setDate(start.getDate()+w*7+r);const k=keyOf(cd);
   if(k>t){cells+='<span class="sq blank"></span>';continue}
   const sc=dayScore(k,ui.calFilter),d=day(k);
   let cls='sq';
   if(sc.skip)cls+=' skip';else cls+=' lv'+sc.level;
   if(sc.rest)cls+=' rest';
   if(isCheat(d))cls+=' cheat';
   if(k===t)cls+=' today';
   const lab=fmtDay(k)+': '+(sc.skip?'skipped':sc.empty?'nothing logged':sc.total?`${sc.hits} of ${sc.total} goals`:'logged');
   cells+=`<button class="${cls}" data-act="goday" data-k="${k}" aria-label="${esc(lab)}" title="${esc(lab)}"></button>`;
  }
 }
 const filters=[['all','All goals'],...GOALS.filter(g=>S.profile.goals[g.k].on).map(g=>[g.k,g.label])];
 let h=banners();
 h+=`<div><div class="eyebrow">Last 6 months</div><h1>Your squares</h1></div>`;
 h+=`<section class="card"><div class="chips">${filters.map(([k,l])=>`<button class="pill" data-act="calf" data-v="${k}" aria-pressed="${ui.calFilter===k}">${l}</button>`).join('')}</div>
 <div class="hm-wrap" id="hmwrap"><div class="hm"><span></span><div class="hm-months">${months}</div>
 <div class="hm-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
 <div class="hm-grid">${cells}</div></div></div>
 <div class="legend">Less <span class="sq"></span><span class="sq lv1"></span><span class="sq lv2"></span><span class="sq lv3"></span><span class="sq lv4"></span> More<span class="gapx"></span><span class="sq rest"></span> Rest<span class="gapx"></span><span class="sq skip"></span> Skip<span class="gapx"></span><span class="sq cheat"></span> Cheat meal</div>
 <p class="small muted" style="margin:0">Tap a square to open that day. ${ui.calFilter==='all'?'Darker green means more of your goals were hit.':'Showing only '+esc(GOALS.find(g=>g.k===ui.calFilter).label.toLowerCase())+'.'}</p></section>`;

 // this month
 const now=parseKey(t),mStart=keyOf(new Date(now.getFullYear(),now.getMonth(),1));
 let logged=0,perfect=0,cheats=0,workouts=0,rests=0;
 for(let k=mStart;k<=t;k=addDays(k,1)){const d=day(k);if(!hasData(d))continue;logged++;const sc=dayScore(k);if(sc.total&&sc.hits===sc.total)perfect++;cheats+=cheatCount(d);if(d.lift&&d.lift.type)workouts++;if(d.status==='rest')rests++}
 h+=`<section class="card"><div class="card-h"><h2>${now.toLocaleDateString(undefined,{month:'long'})} so far</h2><span class="meta">${now.getDate()} days</span></div>
 <div class="stats"><div class="stat"><b>${logged}</b><span>Days logged</span></div><div class="stat"><b>${perfect}</b><span>All goals hit</span></div><div class="stat"><b>${workouts}</b><span>Lifting days</span></div>
 <div class="stat"><b>${rests}</b><span>Rest days</span></div><div class="stat"><b>${cheats}</b><span>Cheat meals</span></div><div class="stat"><b>${logStreak()}</b><span>Log streak</span></div></div></section>`;

 // streaks
 h+=`<section class="card"><h2>Current streaks</h2><div class="hitbars">${GOALS.filter(g=>S.profile.goals[g.k].on).map(g=>{const s=streak(g.k);return`<div class="spread"><span>${g.label}</span><span class="num">${s} day${s===1?'':'s'}</span></div>`}).join('')}</div>
 <p class="small muted" style="margin:0">Rest and skip days don't break a streak. Today counts once you hit it.</p></section>`;
 return h;
}

/* charts */
function niceTicks(lo,hi,n){const span=hi-lo||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));return out}
function barChart(keys,vals,o){
 const W=340,H=150,L=40,R=6,T=10,B=22;
 const pw=W-L-R,ph=H-T-B;
 const vmax=Math.max(1,...vals.filter(v=>v!=null),o.band?o.band[1]:0,o.line||0)*1.08;
 const y=v=>T+ph-(v/vmax)*ph;
 const n=keys.length,bw=pw/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
 niceTicks(0,vmax,3).forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`});
 if(o.band)s+=`<rect x="${L}" width="${pw}" y="${y(o.band[1])}" height="${y(o.band[0])-y(o.band[1])}" fill="var(--accent)" opacity=".12"/>`;
 if(o.line)s+=`<line x1="${L}" x2="${W-R}" y1="${y(o.line)}" y2="${y(o.line)}" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1.2"/>`;
 vals.forEach((v,i)=>{if(v==null)return;const ok=o.band?(v>=o.band[0]&&v<=o.band[1]):o.line?v>=o.line:true;const x=L+i*bw+bw*.18,w=Math.max(1.5,bw*.64);s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${T+ph-y(v)}" rx="${Math.min(2,w/3)}" fill="${ok?'var(--accent)':'var(--muted)'}" opacity="${ok?1:.55}"/>`});
 [0,Math.floor((n-1)/2),n-1].forEach((i,ix,a)=>{if(a.indexOf(i)!==ix)return;s+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDay(keys[i],{month:'short',day:'numeric'})}</text>`});
 return s+'</svg>';
}
function weightChart(keys,ws){
 const W=340,H=170,L=40,R=8,T=12,B=22,pw=W-L-R,ph=H-T-B;
 const pts=ws.filter(v=>v!=null);if(pts.length<1)return'';
 const avg=keys.map((k,i)=>{let a=[];for(let j=Math.max(0,i-6);j<=i;j++)if(ws[j]!=null)a.push(ws[j]);return a.length&&ws.slice(0,i+1).some(v=>v!=null)?a.reduce((x,y)=>x+y,0)/a.length:null});
 const all=[...pts,...avg.filter(v=>v!=null)];
 let lo=Math.min(...all),hi=Math.max(...all);const padv=Math.max(.4,(hi-lo)*.15);lo-=padv;hi+=padv;
 const n=keys.length,x=i=>L+(n===1?pw/2:i*pw/(n-1)),y=v=>T+ph-(v-lo)/(hi-lo)*ph;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight with 7-day average">`;
 niceTicks(lo,hi,4).forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end">${fmt1(t)}</text>`});
 let path='';avg.forEach((v,i)=>{if(v==null)return;path+=(path?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)});
 if(path){s+=`<path d="${path} L${x(avg.length-1-[...avg].reverse().findIndex(v=>v!=null))} ${T+ph} L${x(avg.findIndex(v=>v!=null))} ${T+ph}Z" fill="var(--accent)" opacity=".1"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`}
 ws.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.3"/>`});
 const li=avg.length-1-[...avg].reverse().findIndex(v=>v!=null);
 if(li>=0&&avg[li]!=null)s+=`<circle cx="${x(li)}" cy="${y(avg[li])}" r="4" fill="var(--accent)"/>`;
 [0,Math.floor((n-1)/2),n-1].forEach((i,ix,a)=>{if(a.indexOf(i)!==ix)return;s+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDay(keys[i],{month:'short',day:'numeric'})}</text>`});
 return s+'</svg>';
}
function rangeKeys(n){const t=todayKey();return Array.from({length:n},(_,i)=>addDays(t,i-n+1))}

function realBurn(){
 // last 28 days: average intake on food-logged days, weight slope by linear regression
 const keys=rangeKeys(28);
 const food=[],wp=[];
 keys.forEach((k,i)=>{const d=day(k);if(!d||d.status==='skip')return;const c=val(d,'calories');if(c!=null)food.push(c);if(d.weight!=null)wp.push([i,d.weight])});
 const span=wp.length?wp[wp.length-1][0]-wp[0][0]:0;
 if(food.length<14||wp.length<3||span<14)return{ready:false,foodDays:food.length,wDays:wp.length};
 const mx=wp.reduce((a,p)=>a+p[0],0)/wp.length,my=wp.reduce((a,p)=>a+p[1],0)/wp.length;
 const slope=wp.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/wp.reduce((a,p)=>a+(p[0]-mx)**2,0);
 const intake=food.reduce((a,b)=>a+b,0)/food.length;
 return{ready:true,intake,slope,tdee:intake-slope*7700,foodDays:food.length,wDays:wp.length};
}

function hitBars(s){return`<div class="hitbars">${s.hits.map(x=>`<div class="hb"><span>${x.g.label}</span><div class="bar"><i style="width:${x.t?x.h/x.t*100:0}%"></i></div><span class="v">${x.h}/${x.t}</span></div>`).join('')}</div>`}
const rangeLabel=keys=>`${fmtDay(keys[0],{month:'short',day:'numeric',year:'numeric'})} – ${fmtDay(keys[keys.length-1],{month:'short',day:'numeric',year:'numeric'})}`;
function viewSummary(){
 const keys=periodKeys(),n=keys.length,s=summarize(keys);
 let h=banners();
 h+=`<div><div class="eyebrow">Summary</div><h1>${ui.period==='custom'?n+' days':'Last '+n+' days'}</h1></div>
 <div class="seg four" role="group" aria-label="Period">${[[7,'7 days'],[10,'10 days'],[30,'30 days'],['custom','Pick dates']].map(([v,l])=>`<button data-act="period" data-v="${v}" aria-pressed="${ui.period===v}">${l}</button>`).join('')}</div>`;
 if(ui.period==='custom')h+=`<section class="card"><div class="grid2"><label class="f">From<input class="inp" type="date" id="r-from" data-field="range.from" value="${ui.from}" max="${todayKey()}"></label><label class="f">To<input class="inp" type="date" id="r-to" data-field="range.to" value="${ui.to}" max="${todayKey()}"></label></div></section>`;
 h+=`<section class="card">${statTiles(s)}<p class="small muted" style="margin:0">${s.logged} of ${n} days logged${s.skips?`, ${s.skips} skipped`:''}. Averages use logged days only.</p></section>`;
 h+=`<section class="card"><h2>Goals hit</h2>${hitBars(s)}<p class="small muted" style="margin:0">Rest days don't count against steps, cardio or lifting.</p></section>`;
 h+=`<section class="card"><div class="card-h"><h2>PDF report</h2><span class="meta">${rangeLabel(keys)}</span></div><p class="small muted" style="margin:0">Charts and a day-by-day table for this date range, ready to save as a PDF.</p><div class="row"><button class="btn pri" data-act="report">Open PDF report</button></div></section>`;
 const txt=summaryText(s);ui.copyText=txt;
 h+=`<section class="card"><div class="card-h"><h2>Share with friends</h2></div><pre class="share" id="sharetxt">${esc(txt)}</pre><div class="row"><button class="btn pri" data-act="copysum">Copy summary</button></div></section>`;
 return h;
}

document.addEventListener('click',async e=>{

 if(a==='closesheet'){if(e.target.closest('[data-stop]')&&t.classList.contains('scrim'))return;ui.sheet=null;ui.pick=null;renderSheet();render();return}

  case'addnew':{
   const name=$('#nf-name').value.trim(),kcal=num($('#nf-kcal').value),prot=num($('#nf-prot').value)||0,qty=num($('#nf-qty').value)||1;
   if(!name||kcal==null){toast('Add a name and calories first');break}
   const ch=$('#nf-cheat').checked,sv=$('#nf-save').checked;let fid=null;
   if(sv){fid=uid();S.foods.push({id:fid,name,serving:$('#nf-serv').value.trim(),kcal,protein:prot})}
   dayW(dk).food.push({id:uid(),fid,name,kcal,protein:prot,qty,cheat:ch});
   save();render();renderSheet();toast(sv?`Added and saved ${name}`:`Added ${name}`);break}
  case'delfood':{const d=dayW(dk);d.food=d.food.filter(f=>f.id!==t.dataset.id);commit();break}
  case'addlist':{const k=t.dataset.k,d=dayW(dk);d[k]=d[k]||[];d[k].push({type:'',min:null});commit();setTimeout(()=>{const el=document.getElementById('f-'+k+'t'+(d[k].length-1));if(el)el.focus()},0);break}
  case'dellist':dayW(dk)[t.dataset.k].splice(+t.dataset.i,1);commit();break;
  case'theme':S.profile.theme=t.dataset.v;commit();break;
  case'mode':S.profile.mode=t.dataset.v;commit();break;
  case'font':S.profile.font=t.dataset.v;commit();break;
  case'lift':{const d=dayW(dk);if(d.lift&&d.lift.type===t.dataset.v){d.lift.type=null}else{d.lift=Object.assign({min:60},d.lift||{},{type:t.dataset.v})}commit();break}
  case'showex':ui.showEx=true;{const d=dayW(dk);d.lift.exercises=d.lift.exercises||[];if(!d.lift.exercises.length)d.lift.exercises.push({name:'',sets:[{reps:null,wt:null}]});}commit();break;
  case'addex':{const d=dayW(dk);d.lift.exercises=d.lift.exercises||[];d.lift.exercises.push({name:'',sets:[{reps:null,wt:null}]});commit();break}
  case'delex':dayW(dk).lift.exercises.splice(+t.dataset.i,1);commit();break;
  case'addset':{const ex=dayW(dk).lift.exercises[+t.dataset.i];const last=ex.sets[ex.sets.length-1]||{};ex.sets.push({reps:last.reps??null,wt:last.wt??null});commit();break}
  case'delset':dayW(dk).lift.exercises[+t.dataset.i].sets.splice(+t.dataset.j,1);commit();break;
  case'askpreset':ui.askQ=PRESETS[+t.dataset.i];ui.askFallback=false;render();break;
  case'askrange':ui.askRange=t.dataset.v==='all'?'all':+t.dataset.v;ui.askFallback=false;render();break;
  case'askcopy':{const qi=$('#ask-q');if(qi)ui.askQ=qi.value.trim();const txt=buildPrompt(askKeys(),ui.askQ||PRESETS[0]);S.profile.ai=t.dataset.v;save();let ok=false;try{const pr=navigator.clipboard&&navigator.clipboard.writeText(txt);if(pr){pr.then(()=>toast('Copied. Paste it into a new chat.')).catch(()=>{e.preventDefault&&0;ui.askFallback=true;render();const o=$('#ask-out');if(o){o.focus();o.select()}})}else{ui.askFallback=true;setTimeout(render,0)}}catch(err){ui.askFallback=true;setTimeout(render,0)}break}
  case'calf':ui.calFilter=t.dataset.v;render();break;
  case'range':ui.range=+t.dataset.v;render();break;
  case'period':ui.period=t.dataset.v==='custom'?'custom':+t.dataset.v;render();break;
  case'report':go('report');break;
  case'print':try{window.print()}catch(err){toast('Printing isn\'t available here')}break;
  case'copysum':{const ok=await copy(ui.copyText);if(ok)toast('Summary copied');else{const r=document.createRange();r.selectNodeContents($('#sharetxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected. Tap Copy.')}break}
  case'wunit':S.profile.wUnit=t.dataset.v;commit();break;
  case'lunit':S.profile.lUnit=t.dataset.v;commit();break;
  case'liftmode':S.profile.liftMode=t.dataset.v;commit();break;
  case'delsaved':if(arm('food:'+t.dataset.id)){S.foods=S.foods.filter(f=>f.id!==t.dataset.id);ui.confirm=null;commit();toast('Food deleted')}break;
  case'backup':{const txt=JSON.stringify(S);const ok=await copy(txt);S.lastBackup=new Date().toISOString();save();if(ok){ui.backupText='';render();toast('Backup copied. Paste it into Notes.')}else{ui.backupText=txt;render();const b=$('#bk-out');if(b){b.focus();b.select()}}break}
  case'restore':{const raw=$('#bk-in').value.trim();if(!raw){toast('Paste your backup text first');break}let obj;try{obj=JSON.parse(raw)}catch(err){toast('That text isn\'t a valid backup');break}if(!obj||typeof obj.days!=='object'||!obj.profile){toast('That text isn\'t a valid backup');break}if(arm('restore')){S=Object.assign(newState(),obj);S.profile=Object.assign(defaultProfile(),obj.profile);S.profile.goals=Object.assign(defaultProfile().goals,obj.profile.goals||{});ui.confirm=null;commit();toast('Backup restored')}break}
  case'clear':if(arm('clear')){S=newState();ui.confirm=null;save();ui.tab='setup';render();toast('All data deleted')}break;
  case'startfresh':{const g=S.profile.goals,wU=S.profile.wUnit,lU=S.profile.lUnit,nm=($('#p-name')||{}).value||'',mode=S.profile.liftMode;const keepFoods=S.example?[]:S.foods,ap={font:S.profile.font,theme:S.profile.theme,mode:S.profile.mode};S=newState();Object.assign(S.profile,ap);S.profile.goals=g;S.profile.wUnit=wU;S.profile.lUnit=lU;S.profile.liftMode=mode;S.profile.name=nm.trim();S.foods=keepFoods;ui.date=todayKey();save();go('today');toast('Your log is ready');break}
 }
});

document.addEventListener('change',e=>{
 const t=e.target;const f=t.dataset&&t.dataset.field;if(!f)return;
 const dk=ui.date,p=f.split('.'),v=t.type==='checkbox'?t.checked:t.value;
 if(p[0]==='profile'){S.profile[p[1]]=v;save();renderTabs();return}
 if(p[0]==='goal'){const gg=S.profile.goals[p[1]];if(p[2]==='on')gg.on=v;else{const n=num(v);if(n!=null)gg[p[2]]=n}save();if(ui.tab!=='setup')render();return}
 if(p[0]==='ask'){ui.askQ=v;ui.askFallback=false;return}
 if(p[0]==='range'){if(v){ui[p[1]]=v}render();return}
 if(p[0]==='food'){const fd=S.foods.find(x=>x.id===p[1]);if(!fd)return;if(p[2]==='kcal'||p[2]==='protein'){const n=num(v);if(n!=null)fd[p[2]]=n}else fd[p[2]]=v;save();return}
 const d=dayW(dk);
 switch(p[0]){
  case'steps':d.steps=num(v)==null?null:Math.round(num(v));break;
  case'weight':d.weight=num(v)==null?null:toKg(num(v));break;
  case'sleep':d.sleep=num(v);break;
  case'notes':d.notes=v;break;
  case'liftMin':d.lift.min=num(v);break;
  case'meas':{d.meas=d.meas||{};const n=num(v);if(n==null)delete d.meas[p[1]];else d.meas[p[1]]=n;break}
  case'cardio':case'hiit':case'func':case'other':{const c=d[p[0]][+p[1]];if(p[2]==='min')c.min=num(v);else c.type=v;break}
  case'ex':d.lift.exercises[+p[1]].name=v;break;
  case'set':{const s=d.lift.exercises[+p[1]].sets[+p[2]];s[p[3]]=num(v);break}
 }
 save();
 // refresh goal summary without stealing focus from the next field
 const active=document.activeElement&&document.activeElement.id;
 const y=window.scrollY;render();window.scrollTo(0,y);
 if(active){const el=document.getElementById(active);if(el&&el!==document.body){try{el.focus({preventScroll:true})}catch(_){}}}
});

/* ---------- boot ---------- */
testStorage();
S=load();
if(S){S.profile=Object.assign(defaultProfile(),S.profile);S.profile.goals=Object.assign(defaultProfile().goals,S.profile.goals||{})}
if(!S){S=exampleState();if(storageOk)save()}
ui.date=todayKey();ui.to=todayKey();ui.from=addDays(ui.to,-29);
render();
// roll over at midnight if left open
setInterval(()=>{const t=todayKey();if(ui.lastToday&&ui.lastToday!==t&&ui.date===ui.lastToday){ui.date=t;render()}ui.lastToday=t},60000);
ui.lastToday=todayKey();
})();
</script>

</body></html>
